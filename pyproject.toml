[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cua-automation"
version = "0.1.0"
description = "Computer-use automation system: LLM-driven discovery, typed capability artifacts, deterministic replay, and human handoff for legacy back-office UIs."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "python-dotenv>=1.0",
    "playwright>=1.47",
    "httpx>=0.27",
    "openai>=1.40",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-timeout>=2.3",
]

[project.scripts]
cua = "cua.cli:app"

[tool.setuptools.packages.find]
include = ["cua*", "mock_app*"]

[tool.setuptools.package-data]
mock_app = ["templates/*.html", "static/*", "data/*.json"]
cua = ["surface/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 60
addopts = "-q"
